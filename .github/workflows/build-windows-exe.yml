name: Build DinoQuest for Windows (.exe)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "game_v2/**"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: write

jobs:
  windows:
    name: Export Godot 4.4.1 for Windows x64
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Check game and export templates
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          test -s game_v2/project.godot
          test -s game_v2/scenes/main.tscn
          test -s game_v2/scripts/main.gd
          test -s game_v2/scripts/arena.gd
          test -s game_v2/assets/hero.png
          test -s game_v2/export_presets.cfg
          test -s /root/.local/share/godot/export_templates/4.4.1.stable/windows_release_x86_64.exe
          # GitHub Actions sets HOME to /github/home, not /root.
          # Godot only searches for templates under the effective HOME.
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable "$HOME/.local/share/godot/export_templates/"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/windows_release_x86_64.exe"

      - name: Import assets and check GDScript
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path game_v2 --import 2>&1 | tee import.log
          if grep -Ei '(SCRIPT ERROR|Parser Error|Parse Error)' import.log; then exit 1; fi

      - name: Test game startup
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path game_v2 --quit-after 90 2>&1 | tee runtime.log
          if grep -Ei '(SCRIPT ERROR|Invalid call|Parser Error|Parse Error)' runtime.log; then exit 1; fi

      - name: Export standalone Windows EXE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --path game_v2 --export-release "Windows Desktop" "$PWD/build/DinoQuest.exe" 2>&1 | tee export.log
          if grep -Ei '(SCRIPT ERROR|Parser Error|Parse Error|Export failed)' export.log; then exit 1; fi
          test -s build/DinoQuest.exe
          test "$(head -c 2 build/DinoQuest.exe)" = "MZ"
          test "$(wc -c < build/DinoQuest.exe)" -gt 10000000
          ls -lh build/DinoQuest.exe

      - name: Upload Windows EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinoQuest-Windows-EXE
          path: build/DinoQuest.exe
          if-no-files-found: error
          retention-days: 60

      - name: Publish Windows EXE on GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ github.run_number }}
          name: DinoQuest for Windows — build ${{ github.run_number }}
          body: |
            DinoQuest, a standalone Godot RPG for Windows 10/11 (64-bit).
            Download DinoQuest.exe below and run it. Godot is not required.
            Built automatically from the game_v2/ source folder.
          make_latest: true
          draft: false
          prerelease: false
          files: build/DinoQuest.exe
          fail_on_unmatched_files: true
